# .github/workflows/douban.yml
name: Sync NeoDB-Book Data
on:
  schedule:
    - cron: "30 1,13 * * *"
  #  watch:
  #    types: [started]

  workflow_dispatch:

jobs:
  douban:
    name: Sync NeoDB-Book Data
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 检查是否安装了 JQ，并记录工作目录
      - name: Check JQ
        run: |
          if ! command -v jq &> /dev/null; then
            echo "jq is not installed. Installing..."
            sudo apt-get update
            sudo apt-get install -y jq
          else
            echo "jq is already installed."
          fi
          echo "WORK_DIR=$(pwd)" >> $GITHUB_ENV

      # 获取本地现有文件的标记数
      - name: Get Current Count
        run: |
          if [ -f data/neodb/books.json ] && jq empty data/neodb/books.json >/dev/null 2>&1; then
            CURRENT_COUNT=$(jq -r '.count // 0' data/neodb/books.json)
          else
            CURRENT_COUNT=0
          fi
          echo "CURRENT_COUNT=$CURRENT_COUNT" >> $GITHUB_ENV
          echo "本地标记数：$CURRENT_COUNT"

      # 下载第一页并校验 JSON
      - name: Get NeoDB JSON and Count
        run: |
          set -e
          curl -sS -X 'GET' \
            'https://neodb.prvcy.page/api/me/shelf/complete?category=book&page=1' \
            -H 'accept: application/json' \
            -H 'Authorization: Bearer ${{ secrets.NEODB_ACCESS_TOKEN }}' \
            -o book1.json

          if ! jq empty book1.json >/dev/null 2>&1; then
            echo "::error::NeoDB API 返回的不是合法 JSON，实际内容如下："
            echo "----- book1.json 开头 -----"
            head -c 2000 book1.json
            echo ""
            echo "----- book1.json 结尾 -----"
            exit 1
          fi

          REMOTE_COUNT=$(jq -r '.count' book1.json)
          echo "REMOTE_COUNT=$REMOTE_COUNT" >> $GITHUB_ENV
          echo "远程标记数：$REMOTE_COUNT"

      # 对比本地和远程标记数，用 should_sync 控制后续步骤
      - name: Count Compare
        run: |
          if [ "${{ env.REMOTE_COUNT }}" = "${{ env.CURRENT_COUNT }}" ]; then
            echo "should_sync=false" >> $GITHUB_ENV
            echo "标记数一致，跳过后续同步。"
          else
            echo "should_sync=true" >> $GITHUB_ENV
            echo "标记数不一致，开始同步。"
          fi

      # 下载所有数据
      - name: Get All NeoDB Count
        if: env.should_sync == 'true'
        run: |
          set -e
          pages=$(jq -r '.pages' book1.json)
          if [ -z "$pages" ] || [ "$pages" = "null" ]; then
            echo "::error::无法从 book1.json 中读取 pages 字段"
            cat book1.json
            exit 1
          fi
          echo "共 $pages 页"

          mkdir -p neodb
          cd neodb

          for ((i=1; i<=$pages; i++)); do
            url="https://neodb.prvcy.page/api/me/shelf/complete?category=book&page=$i"
            filename="book$i.json"

            curl -sS -X 'GET' "$url" \
              -H 'accept: application/json' \
              -H 'Authorization: Bearer ${{ secrets.NEODB_ACCESS_TOKEN }}' \
              -o "$filename"

            if ! jq empty "$filename" >/dev/null 2>&1; then
              echo "::error::下载 $filename 失败，返回内容不是 JSON："
              cat "$filename"
              exit 1
            fi
            echo "已下载 $filename"
          done

          # 合并所有页
          jq -c -s '{data: map(.data[]) | unique | sort_by(.created_time) | reverse, pages: map(.pages)[0], count: map(.count)[0]}' *.json > books.json

          cp -f books.json "${{ env.WORK_DIR }}/data/neodb/books.json"
          echo "已更新 data/neodb/books.json"

      # 下载封面
      - name: Download NeoDB Cover
        if: env.should_sync == 'true'
        run: |
          set -e
          mkdir -p data/neodb/cover

          image_urls=$(jq -r '.data[].item.cover_image_url // empty' data/neodb/books.json)

          for url in $image_urls; do
            [ -z "$url" ] && continue
            filename=$(basename "$url")
            filepath="data/neodb/cover/$filename"
            if [ -f "$filepath" ]; then
              echo "Skipping $filename - File already exists"
            else
              curl -sS -o "$filepath" "$url" || echo "Failed to download $url"
              echo "Downloaded $filename"
            fi
          done

      # 把修改后的数据提交到 GitHub 仓库
      - name: Git Add and Commit
        if: env.should_sync == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          message: 'chore(data): update neodb book data'
          add: './data/neodb'